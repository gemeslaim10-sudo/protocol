<script>
const form = document.getElementById('reviewForm');
const generateBtn = document.getElementById('generatePrompt');
const geminiReviewBtn = document.getElementById('geminiReviewBtn');
const outputContainer = document.getElementById('outputContainer');
const output = document.getElementById('output');
const copyBtn = document.getElementById('copyPrompt');
const copyMessage = document.getElementById('copyMessage');
const promptButtonText = document.getElementById('promptButtonText');
const geminiButtonText = document.getElementById('geminiButtonText');

const activationKeyInput = document.getElementById('activationKeyInput');
const activationButton = document.getElementById('activationButton');
const activationStatus = document.getElementById('activationStatus');
const activationArea = document.getElementById('activationArea');
const SECRET_ACTIVATION_KEY = 'art start';
let isActivated = false;

const contentTypeSelect = document.getElementById('contentType');
const contentDescLabel = document.getElementById('contentDescLabel');
const captionFieldContainer = document.getElementById('captionFieldContainer');
const captionText = document.getElementById('captionText');
const contentLanguageInput = document.getElementById('contentLanguage'); // تغير لـ input


// تم تعديل قاعدة الحقول الإجبارية لاستخدام contentLanguage كحقل إجباري عادي
const baseRequiredFields = ['clientName','geoScope','services','targetClients','contentLanguage','platform','publishDate','contentType','contentDesc'];

// --- Gemini API Configuration ---
// مفتاح API الذي تم إدخاله من قبل المستخدم
const apiKey = "AIzaSyATs1jekt5-HnGJGgI38I6nqnOzUXJgfmQ";
const geminiApiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

// البروتوكول الجديد: التركيز على الإنشاء والكتابة النهائية للمحتوى/السكريبت
const systemPrompt = "أنت كاتب محتوى إعلاني وتسويقي مبدع ومتخصص في صياغة الكابشنز، الشعارات، والسكريبتات القابلة للنشر فوراً، مع مراعاة دقيقة للغة واللهجة المحددة والنطاق الجغرافي والجمهور المستهدف والمنصة. مهمتك هي: 1. مراجعة النص/الوصف المُدخل. 2. تطبيق جميع التعديلات اللغوية والبيعية اللازمة. 3. دمج الكلمات المفتاحية الأكثر تداولاً أو بحثاً (SEO). 4. إنتاج النسخة النهائية والجذابة للمحتوى أو السكريبت المطلوب. يجب أن يكون الناتج هو **النسخة النهائية الجاهزة للنشر فقط**، دون أي تحليل أو تقييم إضافي، وبصيغة نصية مباشرة لا تضع جداول نهائيا في الاجابات";

// --- Utility Functions ---

/**
 * Executes a fetch request with exponential backoff for resilience.
 */
async function fetchWithRetry(url, options, maxRetries = 5) {
    let delay = 1000;
    for (let i = 0; i < maxRetries; i++) {
        try {
            const response = await fetch(url, options);
            if (response.status === 429 && i < maxRetries - 1) {
                await new Promise(resolve => setTimeout(resolve, delay));
                delay *= 2;
                continue;
            }
            if (!response.ok) {
                const errorBody = await response.text();
                throw new Error(`API call failed with status ${response.status}: ${errorBody}`);
            }
            return response;
        } catch (error) {
            if (i === maxRetries - 1) throw error;
            await new Promise(resolve => setTimeout(resolve, delay));
            delay *= 2;
        }
    }
}

// دالة لتهيئة القيم الافتراضية
function initializeDefaultValues() {
    // تعيين تاريخ اليوم الحالي كقيمة افتراضية لتاريخ النشر
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0'); // Months start at 0!
    const dd = String(today.getDate()).padStart(2, '0');
    const todayString = `${yyyy}-${mm}-${dd}`;
    document.getElementById('publishDate').value = todayString;

    // القيم الافتراضية الأخرى تم تعيينها في HTML
    
    checkFormValidity();
}


// يتم استدعاء تهيئة القيم عند تحميل الصفحة
window.addEventListener('load', initializeDefaultValues);


// --- Form and UI Logic ---

function updateCaptionFieldVisibility() {
    const selectedType = contentTypeSelect.value;
    const needsCaption = ['نص','صورة','فيديو'].includes(selectedType);
    const isLink = selectedType === 'رابط';

    if(needsCaption){
        captionFieldContainer.classList.remove('hidden');
        captionText.required = true;
        contentDescLabel.textContent = 'وصف المحتوى المرئي/السمعي (إذا وُجد)';
        document.getElementById('contentDesc').required = false;
    } else {
        captionFieldContainer.classList.add('hidden');
        captionText.required = false;
        if(isLink) contentDescLabel.textContent = 'الرابط المستهدف للنشر (URL)';
        else contentDescLabel.textContent = 'النص أو وصف المحتوى أو الرابط';
        document.getElementById('contentDesc').required = true;
    }
}

function checkFormValidity(){
    const currentRequiredFields = [...baseRequiredFields];
    
    // إضافة حقل الكابشن شرطياً
    if(!captionFieldContainer.classList.contains('hidden')) {
        currentRequiredFields.push('captionText');
    }
    
    // تم حذف منطق إضافة حقل اللغة المخصصة شرطياً

    const allFilled = currentRequiredFields.every(id => {
        const el = document.getElementById(id);
        // التحقق من القيمة والاحتفاظ بالشرط المطلوب
        return el && el.value.trim() !== '';
    });
    
    const isReady = allFilled && isActivated;

    generateBtn.disabled = !isReady;
    geminiReviewBtn.disabled = !isReady;


    const commonText = isActivated?'':' (البروتوكول غير مُفعَّل)';
    
    // Update main buttons status
    promptButtonText.textContent = 'إنشاء ونسخ البرومبت التقليدي'+commonText;
    if (isReady) {
        // تم تغيير النص ليعكس وظيفة الإنشاء الجديدة
        geminiButtonText.innerHTML = `✨ إنشاء المحتوى النهائي المُحسّن (Gemini)`;
        promptButtonText.textContent = 'إنشاء ونسخ البرومبت التقليدي';
    } else if (!isActivated) {
        geminiButtonText.innerHTML = `✨ إنشاء المحتوى النهائي المُحسّن (Gemini)${commonText}`;
    } else {
        geminiButtonText.innerHTML = '✨ يرجى ملء جميع الحقول الإجبارية';
        promptButtonText.textContent = 'يرجى ملء جميع الحقول الإجبارية';
    }
}

form.addEventListener('input', checkFormValidity);
contentTypeSelect.addEventListener('change',()=>{updateCaptionFieldVisibility(); checkFormValidity();});
// تم حذف ربط دالة updateCustomLanguageField بالحدث

activationButton.addEventListener('click', handleActivation);
function handleActivation(){
    const inputKey = activationKeyInput.value.trim();
    if(inputKey === SECRET_ACTIVATION_KEY){
        isActivated = true;
        activationStatus.textContent = '✅ تم التفعيل بنجاح. يمكنك الآن البدء بمراجعة المحتوى.';
        activationStatus.classList.remove('text-red-700'); activationStatus.classList.add('text-green-700');
        activationKeyInput.disabled = true; activationButton.disabled = true; activationButton.textContent = 'مُفعَّل';
        activationArea.classList.remove('border-red-400','bg-red-50'); activationArea.classList.add('border-green-400','bg-green-50');
        checkFormValidity();
    } else {
        isActivated = false;
        activationStatus.textContent = '❌ خطأ في الرمز! لا يمكن تفعيل البروتوكول. برجاء المحاولة مجدداً.';
        activationStatus.classList.remove('text-green-700'); activationStatus.classList.add('text-red-700');
        activationArea.classList.remove('border-green-400','bg-green-50'); activationArea.classList.add('border-red-400','bg-red-50');
        checkFormValidity();
    }
}

updateCaptionFieldVisibility();
checkFormValidity();

function getFormData(){
    const selectedType = contentTypeSelect.value;
    // التأكد من جلب النص الأساسي سواء كان كابشن أو وصف (حسب نوع المحتوى)
    let contentMainText = '';
    if (['نص', 'صورة', 'فيديو'].includes(selectedType)) {
        contentMainText = captionText.value.trim();
    } else if (selectedType === 'رابط') {
        contentMainText = document.getElementById('contentDesc').value.trim(); // الرابط نفسه أو وصفه
    } else {
        contentMainText = document.getElementById('contentDesc').value.trim();
    }
    
    // قراءة لغة المحتوى من حقل الإدخال النصي مباشرة
    const contentLanguageValue = contentLanguageInput.value.trim();

    const geoScopeValue = document.getElementById('geoScope').value.trim();

    return {
        clientName: document.getElementById('clientName').value.trim(),
        geoScope: geoScopeValue,
        // قراءة لغة المحتوى من الحقل النصي
        contentLanguage: contentLanguageValue,
        services: document.getElementById('services').value.trim(),
        targetClients: document.getElementById('targetClients').value.trim(),
        platform: document.getElementById('platform').value,
        publishDate: document.getElementById('publishDate').value,
        contentType: selectedType,
        captionText: contentMainText, // نستخدم هذا ليكون النص الأساسي للبرومبت
        contentDesc: document.getElementById('contentDesc').value.trim(),
        notes: document.getElementById('notes').value.trim() || 'لا توجد ملاحظات إضافية.',
        activationID: '••••••'
    };
}

function constructPrompt(data){

    contentDetails+=`

${data.captionText}

         contentDetails+=`

---
${document.getElementById('contentDesc').value.trim()}
---
`;

    return `

${contentDetails}

1.  **تحليل وبحث متعمق (Search & Analysis):**
    * قم بإجراء بحث شامل باستخدام أداة Google Search المتاحة لديك لتحديد **أقوى الكلمات المفتاحية النشطة والأكثر بحثًا (SEO)** و **الهاشتاجات الأكثر تداولاً** المتعلقة بـ "${data.services}" و "العملاء المستهدفون: ${data.targetClients}" في "النطاق الجغرافي: ${data.geoScope}" وعلى "المنصة: ${data.platform}".
2.  **الصياغة النهائية:**
    * بناء النسخة النهائية من المحتوى (كابشن أو سكريبت) استناداً إلى النص المُدخَل أعلاه، مع دمج نتائج البحث الاحترافية (الكلمات المفتاحية والهاشتاجات النشطة).
    * تطبيق جميع البروتوكولات البيعية والتسويقية واللغوية بمهارة فائقة.
3.  **التنسيق:**
    * **الرجاء تقديم النص النهائي الجاهز للنشر فقط،** دون أي تحليل أو تقييم.
    * **مهم جداً:** يجب أن يكون النص الناتج خالياً تماماً من أي رموز تنسيق إضافية مثل النجمة (\*)، أو الشرط المائلة للأمام (\/)، أو الشرط السفلية (\_)، أو أي رمز "مريب" قد يحيط بالكلمات، لتكون النسخة صالحة للنسخ واللصق مباشرة.
    * يجب أن يتم وضع أفضل 5-8 هاشتاجات تم العثور عليها في نهاية النص.

**ملحوظة:** ضع في اعتبارك اللغة واللهجة والجمهور المستهدف والنطاق الجغرافي والكلمات الأكثر بحثًا والتداول.`;
}


async function callGemini(userQuery, systemInstruction, outputTitle) {
    // Check if API key is present before calling fetchWithRetry
    if (apiKey === "") {
        outputContainer.classList.remove('hidden');
        output.textContent = '❌ خطأ: مفتاح Gemini API غير مُضاف. يرجى إضافته في متغير apiKey في الإسكربت.';
        document.getElementById('outputTitle').textContent = 'خطأ في التهيئة';
        checkFormValidity();
        return;
    }
    
    const data = getFormData();
    
    outputContainer.classList.remove('hidden');
    document.getElementById('outputTitle').textContent = outputTitle;
    output.innerHTML = `<div class="text-center p-8 text-red-600 font-bold">
        <span class="spinner"></span>
        <span class="mr-2">جاري إنشاء المحتوى بواسطة Gemini...</span>
    </div>`;
    
    geminiReviewBtn.disabled = true;
    generateBtn.disabled = true;
    
    const originalGeminiText = geminiButtonText.innerHTML;
    
    geminiButtonText.innerHTML = `<span class="spinner"></span> جاري العمل...`;

    try {
        const payload = {
            contents: [{ parts: [{ text: userQuery }] }],
            // Enable Google Search for real-time data on trends, SEO, etc.
            tools: [{ "google_search": {} }], 
            systemInstruction: {
                parts: [{ text: systemInstruction }]
            },
        };

        const response = await fetchWithRetry(geminiApiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const result = await response.json();
        const candidate = result.candidates?.[0];

        if (candidate && candidate.content?.parts?.[0]?.text) {
            const text = candidate.content.parts[0].text;
            let sources = [];
            
            const groundingMetadata = candidate.groundingMetadata;
            if (groundingMetadata && groundingMetadata.groundingAttributions) {
                sources = groundingMetadata.groundingAttributions
                    .map(attribution => ({
                        uri: attribution.web?.uri,
                        title: attribution.web?.title,
                    }))
                    .filter(source => source.uri && source.title);
            }

            // Display generated text
            output.textContent = text;
            

            // Add sources if available
            if (sources.length > 0) {
                let sourcesText = '\n\n---\n## مصادر المعلومات (للتدقيق):\n';
                sources.forEach((source, index) => {
                    sourcesText += `\n- [${source.title || 'Source'}](${source.uri})`;
                });
                output.textContent += sourcesText;
            }

        } else {
            output.textContent = '❌ عذراً، لم يتمكن Gemini من إنهاء طلبك. قد تكون المشكلة في تنسيق الإدخال أو عدم توفر بيانات.';
            document.getElementById('outputTitle').textContent = 'خطأ في المعالجة';
        }
    } catch (error) {
        console.error("Gemini API Error:", error);
        output.textContent = `❌ حدث خطأ غير متوقع أثناء الاتصال بخدمة Gemini. الرجاء التحقق من اتصالك وإعادة المحاولة. \n\nالتفاصيل: ${error.message}`;
        document.getElementById('outputTitle').textContent = 'خطأ في النظام';
    } finally {
        geminiButtonText.innerHTML = originalGeminiText;
        checkFormValidity(); // Restore buttons to correct state
    }
}

// --- Event Handlers ---

generateBtn.addEventListener('click',()=>{
    const data = getFormData();
    const promptText = constructPrompt(data);
    outputContainer.classList.remove('hidden');
    output.textContent = promptText;
    document.getElementById('outputTitle').textContent = 'البرومبت التقليدي الجاهز للنسخ:';
});

geminiReviewBtn.addEventListener('click', async ()=>{
    if (!isActivated || geminiReviewBtn.disabled) return;
    const data = getFormData();
    const userQuery = constructPrompt(data);
    callGemini(userQuery, systemPrompt, 'النسخة النهائية للمحتوى (Gemini)');
});


copyBtn.addEventListener('click',()=>{
    // Use execCommand for better iframe compatibility
    try {
        const textarea = document.createElement('textarea');
        textarea.value = output.textContent;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);

        copyMessage.classList.remove('hidden');
        setTimeout(()=>copyMessage.classList.add('hidden'),2500);
    } catch (err) {
        console.error('Could not copy text: ', err);
        // Fallback for environments where execCommand is restricted
        copyMessage.textContent = 'فشل النسخ. الرجاء النسخ يدوياً.';
        copyMessage.classList.remove('hidden');
        setTimeout(()=>copyMessage.classList.add('hidden'), 3500);
    }
});
