const activationButton = document.getElementById('activationButton');

const activationArea = document.getElementById('activationArea');
const SECRET_ACTIVATION_KEY = 'art start';
let isActivated = false;

const contentTypeSelect = document.getElementById('contentType');
const contentDescLabel = document.getElementById('contentDescLabel');
const captionFieldContainer = document.getElementById('captionFieldContainer');
const captionText = document.getElementById('captionText');
const contentLanguageInput = document.getElementById('contentLanguage');

// متغير لتخزين نتيجة الاستبيان (المرحلة 1)
let generatedAnalysisText = '';

// تم تعديل قاعدة الحقول الإجبارية لاستخدام contentLanguage كحقل إجباري عادي
const baseRequiredFields = ['clientName','geoScope','services','targetClients','contentLanguage','platform','publishDate','contentType','contentDesc'];
// الحقول الإجبارية لتوليد الأفكار
const ideaRequiredFields = ['clientName','geoScope','services','targetClients'];

// --- Gemini API Configuration ---
// مفتاح API الذي تم إدخاله من قبل المستخدم
const apiKey = "AIzaSyATs1jekt5-HnGJGgI38I6nqnOzUXJgfmQ";
const geminiApiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

// البروتوكول الجديد: التركيز على الإنشاء والكتابة النهائية للمحتوى/السكريبت
const systemPrompt = "أنت كاتب محتوى إعلاني وتسويقي مبدع ومتخصص في صياغة الكابشنز، الشعارات، والسكريبتات القابلة للنشر فوراً، مع مراعاة دقيقة للغة واللهجة المحددة والنطاق الجغرافي والجمهور المستهدف والمنصة. **مهم جداً:** يجب أن تعتمد تحليلاتك الكمية للمرحلة الأولى على **بيانات مُستخرجة حديثاً من محركات البحث** لضمان دقة الأرقام والنسب اللحظية. مهمتك هي: 1. مراجعة النص/الوصف المُدخل. 2. تطبيق جميع التعديلات اللغوية والبيعية اللازمة. 3. دمج الكلمات المفتاحية الأكثر تداولاً أو بحثاً (SEO). 4. إنتاج النسخة النهائية والجذابة للمحتوى أو السكريبت المطلوب. يجب أن يكون الناتج هو **النسخة النهائية الجاهزة للنشر فقط**، دون أي تحليل أو تقييم إضافي، وبصيغة نصية مباشرة لا تضع جداول نهائيا في الاجابات";

const ideaSystemPrompt = "أنت خبير استراتيجيات تسويق وإبداع متخصص في توليد الأفكار الإعلانية المبتكرة التي تحل مشكلات الجمهور. مهمتك هي استخدام المعلومات المقدمة لإنشاء 5 أفكار تسويقية مبتكرة وقابلة للتنفيذ. يجب أن تستند الأفكار إلى بحث فوري (Real-time search) لضمان فعاليتها الحالية.";


// --- Utility Functions ---

/**
 * Executes a fetch request with exponential backoff for resilience.
 */
async function fetchWithRetry(url, options, maxRetries = 5) {
    let delay = 1000;
    for (let i = 0; i < maxRetries; i++) {
        try {
            const response = await fetch(url, options);
            if (response.status === 429 && i < maxRetries - 1) {
                await new Promise(resolve => setTimeout(resolve, delay));
                delay *= 2;
                continue;
            }
            if (!response.ok) {
                const errorBody = await response.text();
                throw new Error(`API call failed with status ${response.status}: ${errorBody}`);
            }
            return response;
        } catch (error) {
            if (i === maxRetries - 1) throw error;
            await new Promise(resolve => setTimeout(resolve, delay));
            delay *= 2;
        }
    }
}

// دالة لتهيئة القيم الافتراضية
function initializeDefaultValues() {
    // تعيين تاريخ اليوم الحالي كقيمة افتراضية لتاريخ النشر
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0'); // Months start at 0!
    const dd = String(today.getDate()).padStart(2, '0');
    const todayString = `${yyyy}-${mm}-${dd}`;
    document.getElementById('publishDate').value = todayString;

    // القيم الافتراضية الأخرى تم تعيينها في HTML
    
    checkFormValidity();
}


// يتم استدعاء تهيئة القيم عند تحميل الصفحة
window.addEventListener('load', initializeDefaultValues);


// --- Form and UI Logic ---

function updateCaptionFieldVisibility() {
    const selectedType = contentTypeSelect.value;
    const needsCaption = ['نص','صورة','فيديو'].includes(selectedType);
    const isLink = selectedType === 'رابط';

    if(needsCaption){
        captionFieldContainer.classList.remove('hidden');
        captionText.required = true;
        contentDescLabel.textContent = 'وصف المحتوى المرئي/السمعي (إذا وُجد)';
        document.getElementById('contentDesc').required = false;
    } else {
        captionFieldContainer.classList.add('hidden');
        captionText.required = false;
        if(isLink) contentDescLabel.textContent = 'الرابط المستهدف للنشر (URL)';
        else contentDescLabel.textContent = 'النص أو وصف المحتوى أو الرابط';
        document.getElementById('contentDesc').required = true;
    }
}

function checkFormValidity(){
    const currentRequiredFields = [...baseRequiredFields];
    
    // إضافة حقل الكابشن شرطياً
    if(!captionFieldContainer.classList.contains('hidden')) {
        currentRequiredFields.push('captionText');
    }
    
    const allFilled = currentRequiredFields.every(id => {
        const el = document.getElementById(id);
        return el && el.value.trim() !== '';
    });
    
    // التحقق من الحقول الأساسية المطلوبة لتوليد الأفكار
    const ideaFieldsFilled = ideaRequiredFields.every(id => {
        const el = document.getElementById(id);
        return el && el.value.trim() !== '';
    });


    const isReady = allFilled && isActivated;
    const isIdeaReady = ideaFieldsFilled && isActivated;

    generateBtn.disabled = !isReady;
    geminiReviewBtn.disabled = !isReady; // زر الاستبيان
    ideaGeneratorBtn.disabled = !isIdeaReady; // زر توليد الأفكار

    // إذا لم تكن البيانات جاهزة، نعطل زر المرحلة 2 ونخفيه
    if (!isReady) {
        generateContentBtn.disabled = true;
        generateContentBtn.classList.add('hidden');
    } else if (isReady && generatedAnalysisText === '') {
        // البيانات جاهزة ولكن الاستبيان لم يتم، نعطل زر المرحلة 2 ونخفيه
        generateContentBtn.disabled = true;
        generateContentBtn.classList.add('hidden');
    } else if (isReady && generatedAnalysisText !== '') {
        // البيانات جاهزة والاستبيان موجود، نفعل زر المرحلة 2 ونظهره
        generateContentBtn.disabled = false;
        generateContentBtn.classList.remove('hidden');
    }


    const commonText = isActivated?'':' (البروتوكول غير مُفعَّل)';
    
    // تحديث نصوص الأزرار
    promptButtonText.textContent = 'إنشاء ونسخ البرومبت التقليدي'+commonText;
    
    if (isReady) {
        geminiButtonText.innerHTML = `🔍 عرض الاستبيان والتحليل الدقيق (المرحلة 1)`;
        promptButtonText.textContent = 'إنشاء ونسخ البرومبت التقليدي';
        generateContentButtonText.innerHTML = `✅ إنشاء المحتوى النهائي من الاستبيان (المرحلة 2)`;
    } else if (!isActivated) {
        geminiButtonText.innerHTML = `🔍 عرض الاستبيان والتحليل الدقيق (المرحلة 1)${commonText}`;
    } else {
        geminiButtonText.innerHTML = '✨ يرجى ملء جميع الحقول الإجبارية';
        promptButtonText.textContent = 'يرجى ملء جميع الحقول الإجبارية';

async function callGemini(userQuery, systemInstruction, outputTitle, stage) {
    if (apiKey === "") {
        outputContainer.classList.remove('hidden');
        output.textContent = '❌ خطأ: مفتاح Gemini API غير مُضاف. يرجى إضافته في متغير apiKey في الإسكربت.';
        document.getElementById('outputTitle').textContent = 'خطأ في التهيئة';
        checkFormValidity();
        return;
    }
    
    // إعداد حالة التحميل
    outputContainer.classList.remove('hidden');
    document.getElementById('outputTitle').textContent = outputTitle;
    output.innerHTML = `<div class="text-center p-8 text-red-500 font-bold">
        <span class="spinner" style="border-right-color: #ef4444;"></span>
        <span class="mr-2">جاري البحث واستخراج البيانات الآن... ${stage === 'analysis' ? '(المرحلة 1: التحليل)' : stage === 'content' ? '(المرحلة 2: الصياغة)' : '(توليد الأفكار)'}</span>
    </div>`;
    
    // تعطيل جميع الأزرار النشطة
    geminiReviewBtn.disabled = true;
    generateBtn.disabled = true;
    generateContentBtn.disabled = true;
    ideaGeneratorBtn.disabled = true;

    const originalGeminiText = geminiButtonText.innerHTML;
    const originalIdeaText = ideaButtonText.innerHTML;
    
    geminiButtonText.innerHTML = `<span class="spinner" style="border-right-color: #fff;"></span> جاري العمل...`;
    ideaButtonText.innerHTML = `<span class="spinner" style="border-right-color: #fff;"></span> جاري العمل...`;


    try {
        const payload = {
            contents: [{ parts: [{ text: userQuery }] }],
            // تفعيل Google Search Grounding لكلتا المرحلتين وتوليد الأفكار
            tools: [{ "google_search": {} }], 
            systemInstruction: {
                parts: [{ text: systemInstruction }]
            },
        };

        const response = await fetchWithRetry(geminiApiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const result = await response.json();
        const candidate = result.candidates?.[0];

        if (candidate && candidate.content?.parts?.[0]?.text) {
            const text = candidate.content.parts[0].text;
            let sources = [];
            
            const groundingMetadata = candidate.groundingMetadata;
            if (groundingMetadata && groundingMetadata.groundingAttributions) {
                sources = groundingMetadata.groundingAttributions
                    .map(attribution => ({
                        uri: attribution.web?.uri,
                        title: attribution.web?.title,
                    }))
                    .filter(source => source.uri && source.title);
            }

            // عرض النص الناتج
            output.textContent = text;
            
            // إضافة المصادر
            if (sources.length > 0) {
                let sourcesText = '\n\n---\n## مصادر المعلومات (للتدقيق):\n';
                sources.forEach((source) => {
                    sourcesText += `\n- [${source.title || 'Source'}](${source.uri})`;
                });
                output.textContent += sourcesText;
            }

            // منطق التعامل مع المراحل
            if (stage === 'analysis') {
                generatedAnalysisText = text; // تخزين نتيجة التحليل
            } else if (stage === 'content') {
                generatedAnalysisText = ''; // مسح التحليل بعد الصياغة النهائية
            }
            // توليد الأفكار لا يؤثر على حالة التحليل

        } else {
            output.textContent = '❌ عذراً، لم يتمكن Gemini من إنهاء طلبك. قد تكون المشكلة في تنسيق الإدخال أو عدم توفر بيانات.';
            document.getElementById('outputTitle').textContent = 'خطأ في المعالجة';
            generatedAnalysisText = ''; // التأكد من تصفير التحليل في حالة الخطأ
        }
    } catch (error) {
        console.error("Gemini API Error:", error);
        output.textContent = `❌ حدث خطأ غير متوقع أثناء الاتصال بخدمة Gemini. الرجاء التحقق من اتصالك وإعادة المحاولة. \n\nالتفاصيل: ${error.message}`;
            document.getElementById('outputTitle').textContent = 'خطأ في النظام';
        generatedAnalysisText = ''; // التأكد من تصفير التحليل في حالة الخطأ
    } finally {
        geminiButtonText.innerHTML = originalGeminiText;
        ideaButtonText.innerHTML = originalIdeaText;
        checkFormValidity(); // استعادة حالة الأزرار الصحيحة
    }
}

generateBtn.addEventListener('click',()=>{
    const data = getFormData();
    // نستخدم دالة constructPrompt التي تحتوي على المرحلتين كنص للبرومبت التقليدي
    const promptText = constructPrompt(data);
    outputContainer.classList.remove('hidden');
    output.textContent = promptText;
    document.getElementById('outputTitle').textContent = 'البرومبت التقليدي الجاهز للنسخ:';
});

// 2. زر المرحلة الأولى: عرض الاستبيان والتحليل الدقيق
geminiReviewBtn.addEventListener('click', async ()=>{
    if (!isActivated || geminiReviewBtn.disabled) return;
    const data = getFormData();
    const userQuery = constructAnalysisPrompt(data);
    
    // نرسل برومبت الاستبيان ونحدد المرحلة كـ 'analysis'
    await callGemini(userQuery, systemPrompt, 'نتائج الاستبيان والتحليل الدقيق (المرحلة 1)', 'analysis');
});

// 3. زر المرحلة الثانية: إنشاء المحتوى النهائي من الاستبيان
generateContentBtn.addEventListener('click', async ()=>{
    if (!isActivated || generateContentBtn.disabled || generatedAnalysisText === '') return;
    
    const data = getFormData();
    // نستخدم نتيجة التحليل المخزنة لإنشاء برومبت المرحلة 2
    const userQuery = constructContentGenerationPrompt(generatedAnalysisText, data);
    
    // نرسل برومبت الصياغة ونحدد المرحلة كـ 'content'
    await callGemini(userQuery, systemPrompt, 'النسخة النهائية للمحتوى (المرحلة 2)', 'content');
});

// 4. زر توليد الأفكار الإبداعية (الميزة الجديدة)
ideaGeneratorBtn.addEventListener('click', async ()=>{
    if (!isActivated || ideaGeneratorBtn.disabled) return;
    const data = getFormData();
    const userQuery = constructIdeaGenerationPrompt(data);
    
    // نرسل برومبت توليد الأفكار ونحدد المرحلة كـ 'idea'
    await callGemini(userQuery, ideaSystemPrompt, '5 أفكار إعلانية إبداعية (Gemini)', 'idea');
});


copyBtn.addEventListener('click',()=>{
    // Use execCommand for better iframe compatibility
    try {
        const textarea = document.createElement('textarea');
        textarea.value = output.textContent;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);

        copyMessage.classList.remove('hidden');
        setTimeout(()=>copyMessage.classList.add('hidden'),2500);
    } catch (err) {
        console.error('Could not copy text: ', err);
        // Fallback for environments where execCommand is restricted
        copyMessage.textContent = 'فشل النسخ. الرجاء النسخ يدوياً.';
        copyMessage.classList.remove('hidden');
        setTimeout(()=>copyMessage.classList.add('hidden'), 3500);
    }
});
</script>
